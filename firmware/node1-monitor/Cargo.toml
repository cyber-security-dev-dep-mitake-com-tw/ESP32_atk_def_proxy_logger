[package]
name = "node1-monitor"
version.workspace = true
edition.workspace = true

# Node1: promiscuous packet monitor. Captures 802.11 frames, prepends a radiotap
# header, and streams them as NDJSON `packet` events over the ESP32-S3's native USB
# serial to the PC (which writes the PCAP). Built with the ESP-IDF + esp Rust
# toolchain — see firmware/README.md.
[[bin]]
name = "node1-monitor"
harness = false

[dependencies]
common = { path = "../common" }
# esp-idf-svc default features give us std + alloc; binstart provides the app_main
# entry point. It re-exports ::hal and ::sys, so no separate hal/sys deps are needed.
esp-idf-svc = { workspace = true, features = ["binstart"] }
log = { workspace = true }
anyhow = "1"
base64 = "0.22"
serde_json = "1"

[build-dependencies]
embuild = { version = "0.32", features = ["espidf"] }
