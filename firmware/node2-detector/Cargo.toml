[package]
name = "node2-detector"
version.workspace = true
edition.workspace = true

# Node2: deauth/disassoc detector. Promiscuous RX filtered to management frames,
# sliding-window per-BSSID counting (common::detector). Alerts stream to the PC
# over an inbound WebSocket the node dials into the Go agent.
[[bin]]
name = "node2-detector"
harness = false

[dependencies]
common = { path = "../common" }
esp-idf-svc = { workspace = true, features = ["binstart"] }
log = { workspace = true }

[build-dependencies]
embuild = { version = "0.32", features = ["espidf"] }
