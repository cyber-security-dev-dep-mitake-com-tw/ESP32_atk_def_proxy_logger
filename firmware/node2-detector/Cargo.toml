[package]
name = "node2-detector"
version.workspace = true
edition.workspace = true

# Node2: deauth/disassoc detector over WiFi. Joins the lab network as a station,
# dials the backend WebSocket, runs promiscuous RX (mgmt frames) on the AP channel,
# and streams deauth_alert NDJSON events wirelessly. Blue WS2812 LED identifies it.
[[bin]]
name = "node2-detector"
harness = false

[dependencies]
common = { path = "../common" }
esp-idf-svc = { workspace = true, features = ["binstart"] }
# The classic RMT driver (TxRmtDriver/FixedLengthSignal) used to bit-bang the WS2812
# RGB LED is gated behind rmt-legacy on ESP-IDF 5.x. Same 0.45 version esp-idf-svc
# pulls, so features just unify (no links collision).
esp-idf-hal = { version = "0.45", features = ["rmt-legacy"] }
log = { workspace = true }
anyhow = "1"
serde_json = "1"

[build-dependencies]
embuild = { version = "0.32", features = ["espidf"] }

# Pull the ESP-IDF WebSocket client managed component (same as Node3).
[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/esp_websocket_client", version = "1.2.0" }
