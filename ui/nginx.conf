# nginx serving the SPA and proxying API + WebSocket traffic to the backend.
# `backend` resolves via the docker-compose network.
upstream agent {
    server backend:8080;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # REST API.
    location /api/ {
        proxy_pass http://agent;
        proxy_http_version 1.1;
        # /api/events is a WebSocket; these headers allow the upgrade too.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }

    # Node dial-in WebSocket (also reachable directly on the backend port).
    location /ws/ {
        proxy_pass http://agent;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Map the Upgrade header to the Connection header value nginx needs for WebSockets.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
