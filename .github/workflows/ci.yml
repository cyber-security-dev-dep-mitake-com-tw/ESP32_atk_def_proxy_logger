name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Go backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - name: Build agent binary
        run: go build -o bin/agent ./cmd/agent
      - uses: actions/upload-artifact@v4
        with:
          name: agent-linux-amd64
          path: backend/bin/agent

  firmware-common:
    name: Firmware common (host tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: firmware
      # Only the hardware-independent `common` crate is host-testable; the node
      # binaries require the esp toolchain and are built in a separate manual flow.
      - name: Test common crate
        working-directory: firmware
        run: cargo test -p common
      - name: Check formatting
        working-directory: firmware
        run: cargo fmt -p common -- --check

  ui:
    name: React UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui/dist

  analysis:
    name: Julia analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - uses: julia-actions/cache@v2
      - name: Instantiate and test
        working-directory: analysis
        run: |
          julia --project=. -e 'using Pkg; Pkg.instantiate()'
          julia --project=. test/runtests.jl

  robot-e2e:
    name: Robot Framework E2E
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum
      - name: Build agent binary
        working-directory: backend
        run: go build -o bin/agent ./cmd/agent
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Robot Framework
        run: pip install -r tests/robot/requirements.txt
      - name: Run E2E suites
        run: robot --outputdir tests/robot/output tests/robot/suites
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: robot-report
          path: tests/robot/output
